<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- Tarea 1: Instalar bootstrap con un enlace CDN (CSS) -->
  <!-- Esto enlaza la hoja de estilos de Bootstrap a nuestra página para usar sus clases -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <main class="col-md-8 border p-5">
    <div class="container mt-5">
        <h2 class="text-center mb-4" text-black>
                    Contáctanos
                </h2>
                <p class="text-center">
                    Envíanos un mensaje y nos pondremos en contacto contigo lo antes posible.
                </p>
            <div class="card-body">
                <form>
                    <!--m:margen, b, abajo, 3: tamaño o nivel de separación-->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="correo@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Comentario</label>
                        <textarea class="form-control" rows="3" placeholder="Escribe tu comentario"></textarea>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Acepto los términos y condiciones</label>
                    </div>

                    <div id="liveAlertPlaceholder"></div>
                    <button type="button" class="btn btn-light" id="liveAlertBtn">Enviar Formulario</button>
                </form>
            </div>
        </div>
    </div>


    </main>




  

    <!-- Tarea 1: Instalar bootstrap con un enlace CDN (JS) -->
  <!-- Este script es necesario para que funcionen los componentes interactivos como el menú -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
